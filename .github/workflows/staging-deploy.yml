name: Staging — Build & Deploy

on:
  push:
    branches:
      - staging
  pull_request:
    branches: [staging]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate staging Supabase secrets
        run: |
          if [ -z "$URL" ]; then
            echo "❌ VITE_SUPABASE_URL_STAGING non configurato nei GitHub Secrets"
            exit 1
          fi
          echo "✅ Supabase URL staging verificato: $URL"
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}

      - name: Build (staging env)
        run: npm run build
        env:
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}

      - name: Copy Cesium static assets to dist
        run: |
          mkdir -p dist/cesium
          cp -r node_modules/cesium/Build/Cesium/. dist/cesium/

      # Crea il progetto CF Pages se non esiste ancora (prima esecuzione)
      - name: Create Cloudflare Pages project (prima esecuzione)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create test-viaggiatore-nel-tempo --production-branch main

      - name: Verify bundle contains staging Supabase URL
        run: |
          STAGING_ID="jicmmisiptgyumuvzhjn"
          if ! grep -rl "$STAGING_ID" dist/assets/*.js 2>/dev/null | grep -q .; then
            echo "❌ Il bundle NON contiene l'URL Supabase staging!"
            grep -oh 'https://[a-z]*.supabase.co' dist/assets/*.js 2>/dev/null | sort -u || echo "   Nessun URL Supabase trovato"
            exit 1
          fi
          echo "✅ Bundle verificato: URL Supabase staging corretto nel bundle"

      - name: Setup utente admin di test in staging Supabase
        continue-on-error: true
        run: |
          SUPABASE_URL="https://jicmmisiptgyumuvzhjn.supabase.co"
          SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}"
          TEST_EMAIL="${{ secrets.STAGING_TEST_EMAIL }}"
          TEST_PASS="${{ secrets.STAGING_TEST_PASS }}"

          if [ -z "$SERVICE_KEY" ]; then
            echo "⚠️  SUPABASE_SERVICE_ROLE_KEY_STAGING non configurato — skip setup utente"
            exit 0
          fi

          echo "🔑 Cerco utente nel DB staging..."
          USERS_RESP=$(curl -s -w "\n%{http_code}" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            "$SUPABASE_URL/auth/v1/admin/users")
          USERS_HTTP=$(echo "$USERS_RESP" | tail -1)
          USERS_JSON=$(echo "$USERS_RESP" | head -n -1)
          echo "   List users HTTP: $USERS_HTTP"

          if [ "$USERS_HTTP" != "200" ]; then
            echo "❌ Autenticazione Supabase fallita (HTTP $USERS_HTTP)"
            echo "   Verifica che SUPABASE_SERVICE_ROLE_KEY_STAGING sia la service role key JWT (non il project ID)"
            echo "   Risposta: $(echo "$USERS_JSON" | head -c 200)"
            exit 1
          fi

          USER_ID=$(echo "$USERS_JSON" | TEST_EMAIL_VAR="$TEST_EMAIL" python3 -c "
          import sys, json, os
          d = json.load(sys.stdin)
          users = d.get('users', [])
          email = os.environ.get('TEST_EMAIL_VAR', '')
          found = [u['id'] for u in users if u.get('email') == email]
          print(found[0] if found else '')
          " 2>/dev/null || echo "")

          if [ -z "$USER_ID" ]; then
            echo "📝 Creo utente in staging Supabase..."
            CREATE_RESP=$(curl -s -w "\n%{http_code}" -X POST \
              -H "apikey: $SERVICE_KEY" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -H "Content-Type: application/json" \
              "$SUPABASE_URL/auth/v1/admin/users" \
              -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASS\",\"email_confirm\":true}")
            CREATE_HTTP=$(echo "$CREATE_RESP" | tail -1)
            CREATE_JSON=$(echo "$CREATE_RESP" | head -n -1)
            echo "   Create user HTTP: $CREATE_HTTP"
            USER_ID=$(echo "$CREATE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
            if [ -z "$USER_ID" ]; then
              echo "❌ Creazione utente fallita — risposta: $(echo "$CREATE_JSON" | head -c 200)"
              exit 1
            fi
            echo "✅ Utente creato: $USER_ID"
          else
            echo "✅ Utente già esistente: $USER_ID"
          fi

          echo "⬆️  Imposto role=admin nel profilo staging (UPSERT)..."
          UPSERT_RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            "$SUPABASE_URL/rest/v1/profiles" \
            -d "{\"id\":\"$USER_ID\",\"role\":\"admin\"}")
          UPSERT_HTTP=$(echo "$UPSERT_RESP" | tail -1)
          UPSERT_BODY=$(echo "$UPSERT_RESP" | head -n -1)
          echo "   UPSERT profile HTTP: $UPSERT_HTTP"
          if [ "$UPSERT_HTTP" = "403" ]; then
            echo "❌ 403 Forbidden — la service role key non bypassa le RLS."
            echo "   Usa la JWT legacy (eyJhbGci...) come SUPABASE_SERVICE_ROLE_KEY_STAGING, non la sb_secret_."
            echo "   Risposta: $(echo "$UPSERT_BODY" | head -c 300)"
            exit 1
          fi
          if [ "$UPSERT_HTTP" != "200" ] && [ "$UPSERT_HTTP" != "201" ] && [ "$UPSERT_HTTP" != "204" ]; then
            echo "❌ UPSERT fallito (HTTP $UPSERT_HTTP): $(echo "$UPSERT_BODY" | head -c 200)"
            exit 1
          fi
          echo "✅ Ruolo admin impostato per $TEST_EMAIL in staging"

      - name: Deploy to Staging (Cloudflare Pages)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch staging = production branch del progetto test → aggiorna test-viaggiatore-nel-tempo.pages.dev
          # Senza --branch wrangler crea solo un hash-URL preview e NON aggiorna nessun alias.
          command: pages deploy dist --project-name test-viaggiatore-nel-tempo --branch staging --commit-dirty=true

      - name: Verify bundle deployed (no-auth check)
        run: |
          echo "⏳ Attendo propagazione CF Pages (20s)..."
          sleep 20
          ALIAS="https://test-viaggiatore-nel-tempo.pages.dev"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$ALIAS/app" 2>/dev/null || echo "000")
          echo "📡 Staging URL ($ALIAS/app): HTTP $HTTP"
          # Accettiamo 200 (pubblico) o 401 (Basic Auth attivo = deploy avvenuto)
          if [ "$HTTP" = "000" ]; then
            echo "❌ Staging non raggiungibile — problema di rete o deploy fallito"
            exit 1
          fi
          echo "✅ Staging raggiungibile (HTTP $HTTP)"
          echo ""
          echo "🔗 URL staging: $ALIAS/app"
          echo "👤 Credenziali: vedi secret STAGING_TEST_EMAIL / STAGING_TEST_PASS"

      - name: Smoke test — AI entity-chat (Groq LLM)
        run: |
          echo "🤖 Verifico che il pannello AI risponda con il vero LLM (Groq)..."
          RESPONSE=$(curl -s --max-time 40 -X POST \
            "https://test-viaggiatore-nel-tempo.pages.dev/api/entity-chat" \
            -u "${{ secrets.STAGING_BASIC_AUTH_USER }}:${{ secrets.STAGING_BASIC_AUTH_PASS }}" \
            -H "Content-Type: application/json" \
            -d '{"entity":{"title":"Leonardo da Vinci","description":"Artista rinascimentale","year":1452,"category":"person"},"question":"ANALISI — entità correlate sulla mappa: Michelangelo, Raffaello.","history":[],"locale":"it"}')

          echo "Response preview: $(echo "$RESPONSE" | cut -c1-200)"

          if echo "$RESPONSE" | grep -q '"error"'; then
            ERROR=$(echo "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("error","?"))')
            echo "❌ AI entity-chat fallita: $ERROR"
            echo "   Verifica che GROQ_API_KEY sia configurata nell'ambiente Preview di Cloudflare Pages."
            exit 1
          fi

          ANSWER_LEN=$(echo "$RESPONSE" | python3 -c 'import sys,json; print(len(json.load(sys.stdin).get("data",{}).get("answer","")))')
          if [ "$ANSWER_LEN" -lt 100 ]; then
            echo "❌ AI entity-chat: risposta troppo corta (${ANSWER_LEN} chars) — probabile fallback client-side"
            exit 1
          fi

          echo "✅ AI entity-chat operativa — Groq risponde (${ANSWER_LEN} caratteri)"
