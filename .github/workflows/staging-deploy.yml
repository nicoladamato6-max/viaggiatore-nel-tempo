name: Staging — Build & Deploy

on:
  push:
    branches:
      - staging
  pull_request:
    branches: [staging]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate staging Supabase secrets
        run: |
          if [ -z "$URL" ]; then
            echo "❌ VITE_SUPABASE_URL_STAGING non configurato nei GitHub Secrets"
            exit 1
          fi
          PROD_ID="tsdkqaheddnwzgxgphtw"
          if echo "$URL" | grep -q "$PROD_ID"; then
            echo "❌ VITE_SUPABASE_URL_STAGING punta al progetto di PRODUZIONE!"
            echo "   Correggere il secret con l'URL del progetto staging."
            exit 1
          fi
          echo "✅ Supabase URL staging verificato: $URL"
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}

      - name: Build (staging env)
        run: npm run build
        env:
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}

      - name: Copy Cesium static assets to dist
        run: |
          mkdir -p dist/cesium
          cp -r node_modules/cesium/Build/Cesium/. dist/cesium/

      # Crea il progetto CF Pages se non esiste ancora (prima esecuzione)
      - name: Create Cloudflare Pages project (prima esecuzione)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create test-viaggiatore-nel-tempo --production-branch main

      - name: Verify bundle contains staging Supabase URL
        run: |
          STAGING_ID="jicmmisiptgyumuvzhjn"
          if ! grep -rl "$STAGING_ID" dist/assets/*.js 2>/dev/null | grep -q .; then
            echo "❌ Il bundle NON contiene l'URL Supabase staging!"
            grep -oh 'https://[a-z]*.supabase.co' dist/assets/*.js 2>/dev/null | sort -u || echo "   Nessun URL Supabase trovato"
            exit 1
          fi
          echo "✅ Bundle verificato: URL Supabase staging corretto nel bundle"

      - name: Deploy to Staging (Cloudflare Pages)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # NIENTE --branch: wrangler direct-upload senza --branch aggiorna il root URL
          # (test-viaggiatore-nel-tempo.pages.dev). Con --branch crea solo un preview alias.
          command: pages deploy dist --project-name test-viaggiatore-nel-tempo --commit-dirty=true

      - name: Verify staging root URL is live
        run: |
          echo "⏳ Attendo propagazione CF Pages (15s)..."
          sleep 15
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://test-viaggiatore-nel-tempo.pages.dev/app)
          if [ "$HTTP" != "200" ]; then
            echo "❌ Staging non risponde: HTTP $HTTP"
            exit 1
          fi
          echo "✅ Staging risponde HTTP 200"
          # Verifica che il bundle deployato contenga BridgeConsole (componente corrente)
          BUNDLE_URL=$(curl -s https://test-viaggiatore-nel-tempo.pages.dev/app | grep -o 'src="/assets/index-[^"]*\.js"' | head -1 | sed 's/src="//;s/"//')
          if [ -n "$BUNDLE_URL" ]; then
            if curl -s "https://test-viaggiatore-nel-tempo.pages.dev$BUNDLE_URL" | grep -q "BridgeConsole"; then
              echo "✅ Bundle contiene BridgeConsole — versione corretta deployata"
            else
              echo "⚠️  BridgeConsole non trovato nel bundle — verificare manualmente"
            fi
          fi
