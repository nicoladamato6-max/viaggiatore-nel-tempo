name: Staging — Build & Deploy

on:
  push:
    branches:
      - staging
  pull_request:
    branches: [staging]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate staging Supabase secrets
        run: |
          if [ -z "$URL" ]; then
            echo "❌ VITE_SUPABASE_URL_STAGING non configurato nei GitHub Secrets"
            exit 1
          fi
          PROD_ID="tsdkqaheddnwzgxgphtw"
          if echo "$URL" | grep -q "$PROD_ID"; then
            echo "❌ VITE_SUPABASE_URL_STAGING punta al progetto di PRODUZIONE!"
            echo "   Correggere il secret con l'URL del progetto staging."
            exit 1
          fi
          echo "✅ Supabase URL staging verificato: $URL"
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}

      - name: Build (staging env)
        run: npm run build
        env:
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}

      - name: Copy Cesium static assets to dist
        run: |
          mkdir -p dist/cesium
          cp -r node_modules/cesium/Build/Cesium/. dist/cesium/

      # Crea il progetto CF Pages se non esiste ancora (prima esecuzione)
      - name: Create Cloudflare Pages project (prima esecuzione)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create test-viaggiatore-nel-tempo --production-branch main

      - name: Verify bundle contains staging Supabase URL
        run: |
          STAGING_ID="jicmmisiptgyumuvzhjn"
          if ! grep -rl "$STAGING_ID" dist/assets/*.js 2>/dev/null | grep -q .; then
            echo "❌ Il bundle NON contiene l'URL Supabase staging!"
            grep -oh 'https://[a-z]*.supabase.co' dist/assets/*.js 2>/dev/null | sort -u || echo "   Nessun URL Supabase trovato"
            exit 1
          fi
          echo "✅ Bundle verificato: URL Supabase staging corretto nel bundle"

      - name: Deploy to Staging (Cloudflare Pages)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch main = production branch del progetto → aggiorna main.test-...pages.dev
          # e (se il CF Pages project ha main come production branch) aggiorna anche il root URL.
          # Senza --branch wrangler crea solo un hash-URL preview e NON aggiorna nessun alias.
          command: pages deploy dist --project-name test-viaggiatore-nel-tempo --branch main --commit-dirty=true

      - name: Verify bundle deployed (no-auth check)
        run: |
          echo "⏳ Attendo propagazione CF Pages (20s)..."
          sleep 20
          # Il root URL e l'alias /app richiedono Basic Auth (ENVIRONMENT=staging nel middleware).
          # Verifichiamo tramite l'alias branch che non ha Basic Auth forzato.
          ALIAS="https://main.test-viaggiatore-nel-tempo.pages.dev"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$ALIAS/app" 2>/dev/null || echo "000")
          echo "📡 Alias URL ($ALIAS/app): HTTP $HTTP"
          # Accettiamo 200 (pubblico) o 401 (Basic Auth attivo = deploy avvenuto)
          if [ "$HTTP" = "000" ]; then
            echo "❌ Staging non raggiungibile — problema di rete o deploy fallito"
            exit 1
          fi
          echo "✅ Staging raggiungibile (HTTP $HTTP)"
          echo ""
          echo "🔗 URL per il test manuale: $ALIAS/app"
          echo "🔗 Root URL: https://test-viaggiatore-nel-tempo.pages.dev/app"
          echo "👤 Credenziali: nicola.damato6@gmail.com / Voyager2026"
