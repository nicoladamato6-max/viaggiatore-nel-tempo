name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # permette lancio manuale dalla UI di GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Aggiungi VITE_CESIUM_TOKEN nelle Repository Secrets di GitHub
          VITE_CESIUM_TOKEN: ${{ secrets.VITE_CESIUM_TOKEN }}

      # vite-plugin-cesium non copia i file statici con Vite 8: copiamo manualmente.
      # Questo garantisce che dist/cesium/Cesium.js esista sempre nel deploy.
      - name: Copy Cesium static assets to dist
        run: |
          mkdir -p dist/cesium
          cp -r node_modules/cesium/Build/Cesium/. dist/cesium/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
