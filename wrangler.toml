# Cloudflare Pages + Workers local dev config
# Per la produzione, configura i binding nel Cloudflare Pages dashboard:
#   Pages → Il tuo progetto → Settings → Functions
#
# SETUP (una volta sola):
#   1. Crea KV namespace:
#        npx wrangler kv:namespace create "VIAGGIATORE_KV"
#      Copia l'id e mettilo qui sotto
#
#   2. Nel Cloudflare Pages dashboard → Settings → Functions:
#      - KV namespace bindings → Add: VIAGGIATORE_KV → il namespace appena creato
#      - Environment variables → Add secret: JWT_SECRET → una stringa casuale lunga 32+ caratteri
#
#   3. Per lo sviluppo locale:
#        npx wrangler pages dev dist --kv VIAGGIATORE_KV

name = "viaggiatore-nel-tempo"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding  = "VIAGGIATORE_KV"
id       = "PLACEHOLDER_replace_with_your_kv_namespace_id"

[vars]
JWT_SECRET = "local-dev-secret-minimo-32-caratteri-CHANGE-IN-PRODUCTION"
