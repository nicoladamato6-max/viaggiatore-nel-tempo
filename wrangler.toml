# Cloudflare Pages local dev config
# Per la produzione, i binding sono configurati nel Cloudflare Pages dashboard:
#   Pages → viaggiatore-nel-tempo → Settings → Functions
#   - KV namespace bindings: VIAGGIATORE_KV → il namespace creato nel dashboard
#   - Environment variables (secret): JWT_SECRET → stringa casuale 32+ caratteri
#
# Sviluppo locale (dopo aver fatto "npm run build"):
#   npx wrangler pages dev dist --kv VIAGGIATORE_KV=<id-del-namespace>

name = "viaggiatore-nel-tempo"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[vars]
JWT_SECRET = "local-dev-secret-minimo-32-caratteri-CHANGE-IN-PRODUCTION"
